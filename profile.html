<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الملف الشخصي — المحكمة</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="js/supabase-config.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body class="auth-pending">
  <nav class="navbar">
    <div class="container navbar-inner">
      <a class="brand" href="index.html">
        <img src="assets/logo.png" alt="شعار المحكمة">
        <span>المحكمة</span>
      </a>
      <ul class="nav-links" id="navLinks">
        <li><a href="dashboard.html" data-i18n="dashboard">لوحة الطالب</a></li>
        <li><a href="summaries.html" data-i18n="summaries">الملخصات</a></li>
        <li><a href="exams.html" data-i18n="exams">الامتحانات</a></li>
        <li><a class="active" href="profile.html" data-i18n="profile">الملف الشخصي</a></li>
      </ul>
      <div class="row-actions">
        <button class="lang-toggle" type="button" data-lang-toggle>English</button>
        <button class="menu-toggle" type="button" id="menuToggle">☰</button>
      </div>
    </div>
  </nav>

  <main class="profile-layout">
    <aside class="profile-card reveal">
      <div class="profile-avatar-wrap">
        <img class="avatar" id="profileAvatar" src="assets/logo.png" alt="الصورة الشخصية">
        <h2 id="profileName">طالب القانون</h2>
        <p id="profileEmail"></p>
      </div>
      <div class="section" style="padding:24px 0 0">
        <span id="profileStatus" class="status-badge">غير مشترك</span>
        <div class="section" style="padding:20px 0 0">
          <strong data-i18n="accessCode">رمز الدخول:</strong>
          <div class="code-box" id="accessCode">غير متاح</div>
          <button class="mini-button" type="button" id="copyCode" data-i18n="copy" style="margin-top:10px">نسخ</button>
        </div>
      </div>
    </aside>

    <section class="profile-card reveal">
      <div class="section-head">
        <h1 class="section-title" data-i18n="profile">الملف الشخصي</h1>
      </div>

      <form id="profileForm">
        <div class="profile-fields">
          <div class="form-group">
            <label for="fullName" data-i18n="fullName">الاسم الكامل</label>
            <input class="form-control" id="fullName" type="text" required>
          </div>
          <div class="form-group">
            <label for="phone" data-i18n="phone">رقم الهاتف</label>
            <input class="form-control" id="phone" type="tel">
          </div>
          <div class="form-group">
            <label for="gmail" data-i18n="gmail">البريد الإلكتروني</label>
            <input class="form-control" id="gmail" type="email" disabled>
          </div>
          <div class="form-group">
            <label for="avatarInput">صورة الحساب</label>
            <input class="form-control" id="avatarInput" type="file" accept="image/png,image/jpeg,image/webp">
          </div>
        </div>

        <div class="row-actions">
          <button class="button" type="submit" data-i18n="save">حفظ التغييرات</button>
          <button class="button secondary" type="button" id="logoutButton" data-i18n="logout">تسجيل الخروج</button>
        </div>
      </form>
    </section>
  </main>

  <script>
    document.getElementById("menuToggle").addEventListener("click", () => {
      document.getElementById("navLinks").classList.toggle("open");
    });

    let currentUser = null;
    let currentProfile = null;

    window.addEventListener("DOMContentLoaded", async () => {
      currentUser = await requireAuth();
      if (!currentUser) return;

      const { data: profile, error } = await AppSupabase
        .from("profiles")
        .select("*")
        .eq("id", currentUser.id)
        .single();

      if (error) return showToast(error.message, "error");
      currentProfile = profile;

      document.getElementById("fullName").value = profile.full_name || "";
      document.getElementById("phone").value = profile.phone || "";
      document.getElementById("gmail").value = profile.gmail || currentUser.email || "";
      document.getElementById("profileName").textContent = profile.full_name || "طالب القانون";
      document.getElementById("profileEmail").textContent = profile.gmail || currentUser.email || "";

      if (profile.avatar_url) {
        document.getElementById("profileAvatar").src = profile.avatar_url;
      }

      const statusLabels = {
        approved: "معتمد",
        pending: "بانتظار الموافقة",
        none: "غير مشترك",
        banned: "محظور"
      };
      const status = document.getElementById("profileStatus");
      status.textContent = statusLabels[profile.enrollment_status] || "غير مشترك";
      status.className = `status-badge status-${profile.enrollment_status}`;

      document.getElementById("accessCode").textContent =
        profile.access_code || "غير متاح";

      document.getElementById("copyCode").addEventListener("click", () => {
        if (profile.access_code) copyText(profile.access_code);
      });
    });

    document.getElementById("profileForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!currentUser) return;

      let avatarUrl = currentProfile?.avatar_url || null;
      const file = document.getElementById("avatarInput").files[0];

      if (file) {
        if (file.size > 2 * 1024 * 1024) {
          return showToast("حجم الصورة يجب ألا يزيد عن 2 ميجابايت", "error");
        }

        const extension = file.name.split(".").pop().toLowerCase();
        const path = `${currentUser.id}/avatar.${extension}`;

        const { error: uploadError } = await AppSupabase.storage
          .from("avatars")
          .upload(path, file, {
            upsert: true,
            cacheControl: "3600",
            contentType: file.type
          });

        if (uploadError) return showToast(uploadError.message, "error");

        const { data: publicUrl } = AppSupabase.storage
          .from("avatars")
          .getPublicUrl(path);

        avatarUrl = `${publicUrl.publicUrl}?v=${Date.now()}`;
      }

      const { error } = await AppSupabase
        .from("profiles")
        .update({
          full_name: document.getElementById("fullName").value.trim(),
          phone: document.getElementById("phone").value.trim(),
          gmail: document.getElementById("gmail").value.trim(),
          avatar_url: avatarUrl
        })
        .eq("id", currentUser.id);

      if (error) return showToast(error.message, "error");
      showToast("تم حفظ التغييرات بنجاح");
      setTimeout(() => location.reload(), 600);
    });

    document.getElementById("logoutButton").addEventListener("click", async () => {
      await AppSupabase.auth.signOut();
      location.href = "login.html";
    });
  </script>
</body>
</html>
