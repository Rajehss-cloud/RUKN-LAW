<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لوحة الإدارة — المحكمة</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="js/supabase-config.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body class="auth-pending">
  <nav class="navbar">
    <div class="container navbar-inner">
      <a class="brand" href="index.html">
        <img src="assets/logo.png" alt="شعار المحكمة">
        <span>لوحة الإدارة</span>
      </a>

      <ul class="nav-links" id="navLinks">
        <li><a href="dashboard.html" data-i18n="dashboard">لوحة الطالب</a></li>
        <li><a class="active" href="admin.html" data-i18n="admin">الإدارة</a></li>
        <li><a href="profile.html" data-i18n="profile">الملف الشخصي</a></li>
      </ul>

      <div class="row-actions">
        <button class="lang-toggle" type="button" data-lang-toggle>English</button>
        <button class="menu-toggle" type="button" id="menuToggle" aria-label="القائمة">☰</button>
      </div>
    </div>
  </nav>

  <main class="admin-layout">
    <div class="container">
      <div class="section-head reveal">
        <div>
          <div class="eyebrow">Administration Panel</div>
          <h1 class="section-title" data-i18n="admin">لوحة الإدارة</h1>
          <p class="admin-account">المسؤول: sherifeltahawy86@gmail.com</p>
        </div>
        <button class="danger-button" type="button" id="adminLogout" data-i18n="logout">
          تسجيل الخروج
        </button>
      </div>

      <div class="admin-grid">
        <section class="admin-panel reveal">
          <h2>الطلاب وطلبات الاشتراك</h2>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>الاسم</th>
                  <th>البريد</th>
                  <th>الهاتف</th>
                  <th>الحالة</th>
                  <th>الرمز</th>
                  <th>الإجراءات</th>
                </tr>
              </thead>
              <tbody id="studentsTable">
                <tr><td colspan="6">جارٍ تحميل الطلاب...</td></tr>
              </tbody>
            </table>
          </div>
        </section>

        <section class="admin-panel reveal">
          <h2>إضافة إعلان</h2>
          <form id="announcementForm">
            <div class="form-group">
              <label for="announcementTitle">عنوان الإعلان</label>
              <input class="form-control" id="announcementTitle" required>
            </div>

            <div class="form-group">
              <label for="announcementMessage">نص الإعلان</label>
              <textarea class="form-control" id="announcementMessage" rows="5" required></textarea>
            </div>

            <button class="button" type="submit" style="width:100%" data-i18n="sendAnnouncement">
              نشر إعلان
            </button>
          </form>
        </section>
      </div>

      <div class="section">
        <section class="admin-panel reveal">
          <h2>إضافة ملخص أو امتحان</h2>
          <form id="materialForm">
            <div class="profile-fields">
              <div class="form-group">
                <label for="materialTitle">العنوان</label>
                <input class="form-control" id="materialTitle" required>
              </div>

              <div class="form-group">
                <label for="materialSubject">المادة</label>
                <input class="form-control" id="materialSubject" required>
              </div>

              <div class="form-group">
                <label for="materialType">النوع</label>
                <select class="form-control" id="materialType">
                  <option value="summary">ملخص</option>
                  <option value="exam">امتحان / أسئلة</option>
                </select>
              </div>

              <div class="form-group">
                <label for="materialUrl">رابط ملف PDF</label>
                <input
                  class="form-control"
                  id="materialUrl"
                  type="url"
                  required
                  placeholder="https://example.com/file.pdf"
                >
              </div>
            </div>

            <button class="button" type="submit">إضافة المحتوى</button>
          </form>
        </section>
      </div>

      <div class="section">
        <section class="admin-panel reveal">
          <h2>إعدادات الروابط والترويسة</h2>
          <form id="settingsForm">
            <div class="profile-fields">
              <div class="form-group">
                <label for="facebookUrl">Facebook</label>
                <input class="form-control" id="facebookUrl" type="url">
              </div>

              <div class="form-group">
                <label for="instagramUrl">Instagram</label>
                <input class="form-control" id="instagramUrl" type="url">
              </div>

              <div class="form-group">
                <label for="tiktokUrl">TikTok</label>
                <input class="form-control" id="tiktokUrl" type="url">
              </div>

              <div class="form-group">
                <label for="whatsappUrl">WhatsApp</label>
                <input class="form-control" id="whatsappUrl" type="url">
              </div>

              <div class="form-group">
                <label for="heroAr">عنوان الصفحة بالعربية</label>
                <input class="form-control" id="heroAr">
              </div>

              <div class="form-group">
                <label for="heroEn">عنوان الصفحة بالإنجليزية</label>
                <input class="form-control" id="heroEn">
              </div>
            </div>

            <button class="button" type="submit">حفظ الإعدادات</button>
          </form>
        </section>
      </div>
    </div>
  </main>

  <script>
    document.getElementById("menuToggle").addEventListener("click", () => {
      document.getElementById("navLinks").classList.toggle("open");
    });

    window.addEventListener("DOMContentLoaded", async () => {
      const admin = await requireAdmin();
      if (!admin) return;

      await loadStudents();
      await loadSettings();
    });

    async function loadStudents() {
      const { data: students, error } = await AppSupabase
        .from("profiles")
        .select("id,full_name,gmail,phone,enrollment_status,access_code,role")
        .order("created_at", { ascending: false });

      if (error) return showToast(error.message, "error");

      const body = document.getElementById("studentsTable");

      body.innerHTML = (students || []).map((student) => `
        <tr>
          <td>${escapeHTML(student.full_name || "-")}</td>
          <td>${escapeHTML(student.gmail || "-")}</td>
          <td>${escapeHTML(student.phone || "-")}</td>
          <td>${escapeHTML(student.enrollment_status)}</td>
          <td>${escapeHTML(student.access_code || "-")}</td>
          <td>
            <div class="table-actions">
              <button
                class="mini-button"
                type="button"
                data-student-id="${escapeHTML(student.id)}"
                data-student-status="approved"
              >اعتماد</button>

              <button
                class="mini-button"
                type="button"
                data-student-id="${escapeHTML(student.id)}"
                data-student-status="pending"
              >تعليق</button>

              <button
                class="danger-button"
                type="button"
                data-student-id="${escapeHTML(student.id)}"
                data-student-status="banned"
              >حظر</button>
            </div>
          </td>
        </tr>
      `).join("") || '<tr><td colspan="6">لا يوجد طلاب.</td></tr>';
    }

    document.getElementById("studentsTable").addEventListener("click", async (event) => {
      const button = event.target.closest("[data-student-id][data-student-status]");
      if (!button) return;

      const { error } = await AppSupabase.rpc("set_student_status", {
        p_student_id: button.dataset.studentId,
        p_status: button.dataset.studentStatus
      });
      if (error) return showToast(error.message, "error");

      showToast("تم تحديث حالة الطالب");
      await loadStudents();
    });

    document.getElementById("announcementForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      const { error } = await AppSupabase
        .from("announcements")
        .insert({
          title: document.getElementById("announcementTitle").value.trim(),
          message: document.getElementById("announcementMessage").value.trim()
        });

      if (error) return showToast(error.message, "error");

      event.target.reset();
      showToast("تم نشر الإعلان");
    });

    document.getElementById("materialForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      const pdfUrl = document.getElementById("materialUrl").value.trim();

      if (!isSafeHttpUrl(pdfUrl)) {
        return showToast("يرجى إدخال رابط HTTP أو HTTPS صالح", "error");
      }

      const { error } = await AppSupabase
        .from("materials")
        .insert({
          title: document.getElementById("materialTitle").value.trim(),
          subject: document.getElementById("materialSubject").value.trim(),
          type: document.getElementById("materialType").value,
          pdf_url: pdfUrl
        });

      if (error) return showToast(error.message, "error");

      event.target.reset();
      showToast("تمت إضافة المادة");
    });

    async function loadSettings() {
      const { data: settings, error } = await AppSupabase
        .from("site_settings")
        .select("*")
        .eq("id", 1)
        .maybeSingle();

      if (error) return showToast(error.message, "error");
      if (!settings) return;

      document.getElementById("facebookUrl").value = settings.facebook_url || "";
      document.getElementById("instagramUrl").value = settings.instagram_url || "";
      document.getElementById("tiktokUrl").value = settings.tiktok_url || "";
      document.getElementById("whatsappUrl").value = settings.whatsapp_url || "";
      document.getElementById("heroAr").value = settings.hero_title_ar || "";
      document.getElementById("heroEn").value = settings.hero_title_en || "";
    }

    document.getElementById("settingsForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      const urls = [
        document.getElementById("facebookUrl").value,
        document.getElementById("instagramUrl").value,
        document.getElementById("tiktokUrl").value,
        document.getElementById("whatsappUrl").value
      ];

      if (urls.some((url) => url && !isSafeHttpUrl(url))) {
        return showToast("أحد الروابط غير صالح", "error");
      }

      const { error } = await AppSupabase
        .from("site_settings")
        .update({
          facebook_url: urls[0].trim(),
          instagram_url: urls[1].trim(),
          tiktok_url: urls[2].trim(),
          whatsapp_url: urls[3].trim(),
          hero_title_ar: document.getElementById("heroAr").value.trim(),
          hero_title_en: document.getElementById("heroEn").value.trim()
        })
        .eq("id", 1);

      if (error) return showToast(error.message, "error");

      showToast("تم حفظ الإعدادات");
    });

    document.getElementById("adminLogout").addEventListener("click", async () => {
      await AppSupabase.auth.signOut();
      location.href = "login.html";
    });

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }

    function isSafeHttpUrl(value) {
      try {
        const url = new URL(value);
        return ["https:", "http:"].includes(url.protocol);
      } catch {
        return false;
      }
    }
  </script>
</body>
</html>
